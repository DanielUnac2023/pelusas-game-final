name: Integración Continua y Calidad de Código

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Copiar el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Java 21
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Dar permisos de ejecución a Maven Wrapper
      - name: Dar permisos a mvnw
        run: chmod +x backend/mvnw

      # 4. Ejecutar Pruebas Backend y Cobertura (JaCoCo)
      - name: Ejecutar Pruebas y Cobertura JaCoCo
        run: |
          cd backend
          ./mvnw clean verify

      # 5. Ejecutar Pruebas de Mutación con PITest
      - name: Ejecutar Pruebas de Mutación (PITest)
        run: |
          cd backend
          ./mvnw pitest:mutationCoverage
